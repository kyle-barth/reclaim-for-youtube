<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History - YouTube (fixture)</title>
<link rel="stylesheet" href="/static/fixture.css">
<script src="/static/fixture.js"></script>
</head>
<body>
<ytd-app>
  <ytd-masthead><a href="/" id="logo">YouTube</a></ytd-masthead>

      <ytd-section-list-renderer>
        <ytd-item-section-renderer>
          <div id="contents">
            <ytd-reel-shelf-renderer data-test="history-reel-shelf"><a href="/shorts/hhhhhhhhhh1">Shorts you watched</a></ytd-reel-shelf-renderer>
            <ytd-video-renderer data-test="history-video"><a href="/watch?v=hhhhhhhhhh2">A video you watched</a></ytd-video-renderer>
          </div>
        </ytd-item-section-renderer>
      </ytd-section-list-renderer>
    </ytd-browse>
  </ytd-page-manager>
</ytd-app>
</body>
</html>
